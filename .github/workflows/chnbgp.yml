name: BGP-CHN List Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Generate chnbgp.list
      run: |
        export TZ="Asia/Shanghai"
        current_time=$(date +"# Update Time: %m/%d/%Y %H:%M:%S")
        unset TZ
        echo "$current_time" > chnbgp.list

        curl -s https://raw.githubusercontent.com/misakaio/chnroutes2/master/chnroutes.txt | \
          awk 'NR==1 {print; next} NR>=3 {print "IP-CIDR,"$0}' >> chnbgp.list

        curl -s https://raw.githubusercontent.com/gaoyifan/china-operator-ip/ip-lists/china6.txt | \
          sed 's/^/IP-CIDR6,/' >> chnbgp.list

        line_count=$(tail -n +3 chnbgp.list | wc -l)
        sed -i "3i # Total: $line_count" chnbgp.list
        echo "Total lines (excluding top 2): $line_count"

    - name: Commit and push updates
      run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update chnbgp.list"
            git push
          else
            echo "No changes."
          fi