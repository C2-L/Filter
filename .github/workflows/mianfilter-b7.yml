name: Main Filter Files (B7) Update

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update_filters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and modify China_All.list
        run: |
          curl -sS https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/China/China_All.list -o China.list
          ts="# Update Time: $(TZ='Asia/Shanghai' date '+%m/%d/%Y %H:%M:%S')"
          grep -Ev 'AUTHOR:|REPO:|UPDATED:|DOMAIN:|DOMAIN-KEYWORD:|DOMAIN-SUFFIX:|IP-CIDR:|IP-CIDR6:|USER-AGENT:' China.list \
            | sed -e 's/NAME:/Ruleset Name:/g' -e 's/TOTAL:/Total:/g' -e 's/,no-resolve//g'> China.tmp
          echo "$ts" | cat - China.tmp > China.list
          sed -i '3a\' China.list
          
      - name: Download and modify Cloudflare.list
        run: |
          curl -sS https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/Cloudflare/Cloudflare.list -o Cloudflare.list
          ts="# Update Time: $(TZ='Asia/Shanghai' date '+%m/%d/%Y %H:%M:%S')"
          grep -Ev 'AUTHOR:|REPO:|UPDATED:|DOMAIN:|DOMAIN-KEYWORD:|DOMAIN-SUFFIX:|IP-CIDR:|IP-CIDR6:|USER-AGENT:' Cloudflare.list \
            | sed -e 's/NAME:/Ruleset Name:/g' -e 's/TOTAL:/Total:/g' -e 's/,no-resolve//g'> Cloudflare.tmp
          echo "$ts" | cat - Cloudflare.tmp > Cloudflare.list
          sed -i '3a\' Cloudflare.list
          
      - name: Download and modify GlobalMedia_All.list
        run: |
          curl -sS https://raw.githubusercontent.com/blackmatrix7/ios_rule_script/master/rule/Surge/GlobalMedia/GlobalMedia_All.list -o Streaming.list
          ts="# Update Time: $(TZ='Asia/Shanghai' date '+%m/%d/%Y %H:%M:%S')"
          grep -Ev 'AUTHOR:|REPO:|UPDATED:|DOMAIN:|DOMAIN-KEYWORD:|DOMAIN-SUFFIX:|DESCRIPTION:|IP-CIDR:|IP-CIDR6:|PROCESS-NAME:|URL-REGEX:|USER-AGENT:' Streaming.list \
            | sed -e 's/NAME:/Ruleset Name:/g' -e 's/TOTAL:/Total:/g' -e 's/,no-resolve//g'> Streaming.tmp
          echo "$ts" | cat - Streaming.tmp > Streaming.list
          sed -i '3a\' Streaming.list

      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update Filter Files"
            git push
          else
            echo "No changes."
          fi
