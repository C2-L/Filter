name: ASN-CHN List Update

on:
  schedule:
    - cron: '0 21 * * *'
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update-filter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download and process ASN.China.list
        run: |
          set -e
          curl -sSL "https://raw.githubusercontent.com/missuo/ASN-China/main/ASN.China.list" -o ASN.China.list.tmp
          sed '1,3d' ASN.China.list.tmp > temp.list
          sed 's/\/\//#/g' temp.list > processed.list
          line_count=$(wc -l < processed.list)
          total=$((line_count - 1))
          {
            echo "# Update Time: $(TZ=Asia/Shanghai date '+%m/%d/%Y %H:%M:%S')"
            echo "# Name: ASN information in China"
            echo "# Total: $total"
            cat processed.list
          } > chnasn.list
          rm ASN.China.list.tmp temp.list processed.list

      - name: Commit and push updates
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add .
          if ! git diff-index --quiet HEAD; then
            git commit -m "Update chnasn.list"
            git push
          else
            echo "No changes."
          fi
